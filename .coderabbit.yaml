# hft3 uses an external PR AI review connector (e.g. Greptile, ChatGPT/Codex Connector) for GrepLoop.
# CodeRabbit must not auto-review PRs for this repository.
reviews:
  auto_review:
    enabled: false
    description_keyword: ""
    labels: []
    drafts: false
    ignore_title_keywords:
      - "[skip review]"
      - "GREPLOOP_ONLY"
  commit_status: false
  review_status: false
