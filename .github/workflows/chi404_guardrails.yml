name: chi404_guardrails

on:
  push:
    paths:
      - "scripts/chi404_*"
      - "scripts/graphify_*"
      - "packages/data_system/rithmic_trial/**"
      - "packages/data_system/config/rithmic_trial.yaml"
      - "packages/data_system/config/rithmic_api_external.yaml"
      - "packages/backtest_pipeline/src/chi404_latency.py"
      - "connectors/rithmic/**"
      - "tests/test_chi404_*"
      - "tests/test_broker_latency_*"
      - "tests/test_rithmic_*"
      - "docs/vault/CHI404_CANONICAL_ENTRYPOINTS.md"
      - "docs/rithmic_trial/**"
  pull_request:
    paths:
      - "scripts/chi404_*"
      - "scripts/graphify_*"
      - "packages/data_system/rithmic_trial/**"
      - "packages/data_system/config/rithmic_trial.yaml"
      - "packages/data_system/config/rithmic_api_external.yaml"
      - "packages/backtest_pipeline/src/chi404_latency.py"
      - "connectors/rithmic/**"
      - "tests/test_chi404_*"
      - "tests/test_broker_latency_*"
      - "tests/test_rithmic_*"
      - "docs/vault/CHI404_CANONICAL_ENTRYPOINTS.md"
      - "docs/rithmic_trial/**"

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest pyyaml

      - name: CHI404 canonical guardrails
        run: pytest tests/test_chi404_canonical_guardrails.py -q

      - name: Broker latency waterfall tests
        run: pytest tests/test_broker_latency_waterfall.py -q
