name: Workbench verify

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  workbench-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r workbench/requirements.txt
          pip install pytest pyyaml pandas numpy

      - name: Workbench grader suite
        run: python -m pytest tests/test_workbench/ tests/structural_models/ -q --tb=short

      - name: PDF hybrid unit tests
        run: python -m pytest tests/backtest_pipeline/test_pdf_hybrid_strategy.py tests/backtest_pipeline/test_pdf_defensive_ablation.py -q
