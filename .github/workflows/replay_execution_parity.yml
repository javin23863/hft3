name: replay_execution_parity

on:
  push:
    paths:
      - "execution/**"
      - "replay/**"
      - "backtest_pipeline/**"
      - "tests/test_replay_*"
      - "tests/test_execution_*"
      - "tests/test_hftbacktest_*"
      - "tests/test_model_mode_*"
      - "tests/test_latency_band_*"
      - "backtest_pipeline/src/replay_npz_fixture.py"
  pull_request:
    paths:
      - "execution/**"
      - "replay/**"
      - "backtest_pipeline/**"
      - "tests/test_replay_*"
      - "tests/test_execution_*"
      - "tests/test_hftbacktest_*"
      - "tests/test_model_mode_*"
      - "tests/test_latency_band_*"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pytest numpy hftbacktest
      - name: Replay execution parity tests
        run: |
          pytest tests/test_replay_must_emit_order_intents.py \
            tests/test_execution_interface_parity.py \
            tests/test_replay_orders_do_not_route_live.py \
            tests/test_hftbacktest_adapter_order_lifecycle.py \
            tests/test_model_mode_blindness.py \
            tests/test_replay_clock_order_timestamps.py \
            tests/test_latency_band_execution.py -q
