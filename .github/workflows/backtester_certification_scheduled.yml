name: Backtester Full Certification (T2)

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  t2-full-certification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_system/requirements.txt
      - name: Run full certification
        run: bash scripts/run_backtester_certification_full.sh
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtester_certification_scorecard
          path: |
            runtime/validation/backtester_certification_scorecard.json
            runtime/validation/backtester_certification_scorecard.md
            runtime/validation/certification_registry.json
