schema_version: 1
hypotheses:
- hypothesis_id: CRYPTO_H1
  name: BTC spot/perp basis compression
  source_repo: https://github.com/javin23863/crypto-alpha-engine
  source_files:
  - ideas-only extraction
  ideas_only: false
  source_commit_sha: 6f5d8510e306bf2df0832cee7794fd0c871e8fd3
  source_concept_summary: BTC spot/perp basis compression
  economic_mechanism: BTC spot/perp basis compression
  null_hypothesis: Feature set has zero incremental predictive power OOS.
  alternative_hypothesis: Feature set predicts label with positive OOS IC after costs.
  expected_direction: positive
  asset_scope:
  - BTC
  venue_scope:
  - binance_spot
  - binance_perp
  - deribit
  prediction_horizons:
  - 30s
  - 5m
  - 15m
  - 1h
  - 8h
  features_required:
  - spot_mid
  - perp_mid
  - spot_perp_basis
  - basis_pct
  - basis_zscore
  - basis_momentum
  - basis_volatility
  - funding_rate
  - ou_theta
  - ou_mu
  - ou_sigma
  features_optional:
  - btc_mempool_usage_bytes
  btc_node_features: []
  labels:
  - forward_basis_change
  label_formula: forward-looking forward_basis_change
  feature_timestamp_rule: exchange event-time <= t only
  label_timestamp_rule: strictly t+h forward
  point_in_time_controls:
  - T_avail <= T_exch_true
  - max_staleness_ms
  leakage_risks:
  - clock drift
  - forward-filled node snapshots
  costs_required: true
  latency_assumptions:
    ws_rtt_tracking: true
  slippage_assumptions:
    include_spread: true
  regime_controls:
  - vol_regime
  baseline_models:
  - basis_only
  - naive_previous_value
  - logistic_regression
  challenger_models:
  - lightgbm
  - xgboost
  - elastic_net
  ablation_tests: []
  negative_controls:
  - shuffled_labels
  - shifted_features_forward
  - randomized_event_times
  failure_conditions:
  - negative OOS IC
  - leakage check fail
  promotion_criteria:
  - positive_oos_ic
  - positive_after_cost_pnl
  - walk_forward_stable
  backtest_config: backtests/configs/crypto_hypotheses/h1_basis_compression.yaml
  owner_notes: Production ingest via packages/crypto_lane/pipeline.py ingest.
