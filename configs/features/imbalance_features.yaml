feature_version: "1.0.0"
default_windows_ms: [100, 250, 500, 1000, 5000]

features:
  - feature_name: book_imbalance_l1
    feature_family: book_imbalance
    feature_set_id: book_core
    source_schema: mbo
    source_data_class: MBO
    computation_method: "(bid-ask)/(bid+ask) L1 depth"
    window_length: null
    event_time_basis: true
    missing_data_behavior: nan
    degraded_status: false
    latency_estimate_ns: 200

  - feature_name: book_imbalance_l10
    feature_family: book_imbalance
    feature_set_id: book_core
    source_schema: mbo
    source_data_class: MBO
    computation_method: "(bid-ask)/(bid+ask) L1-L10 depth"
    window_length: null
    event_time_basis: true
    missing_data_behavior: nan
    degraded_status: false
    latency_estimate_ns: 400

  - feature_name: microprice
    feature_family: book_imbalance
    feature_set_id: book_core
    source_schema: mbo
    source_data_class: MBO
    computation_method: "L1 microprice"
    window_length: null
    event_time_basis: true
    missing_data_behavior: nan
    degraded_status: false
    latency_estimate_ns: 150

  - feature_name: ofi_l1
    feature_family: order_flow_imbalance
    feature_set_id: ofi_core
    source_schema: mbo
    source_data_class: MBO
    computation_method: "Cont L1 OFI from order events"
    window_length: configurable_ms
    event_time_basis: true
    missing_data_behavior: nan
    degraded_status: false
    latency_estimate_ns: 350

  - feature_name: ofi_depth_proxy
    feature_family: order_flow_imbalance_proxy
    feature_set_id: ofi_core
    source_schema: mbp-10
    source_data_class: MBP_10
    computation_method: "signed depth delta proxy"
    window_length: configurable_ms
    event_time_basis: true
    missing_data_behavior: nan
    degraded_status: true
    latency_estimate_ns: 300

  - feature_name: signed_trade_pressure
    feature_family: trade_pressure_only
    feature_set_id: trade_core
    source_schema: trades
    source_data_class: TRADES
    computation_method: "(buy-sell)/(buy+sell) aggressor"
    window_length: configurable_ms
    event_time_basis: true
    missing_data_behavior: zero
    degraded_status: false
    latency_estimate_ns: 100

  - feature_name: auction_total_imbalance
    feature_family: auction_imbalance
    feature_set_id: auction_core
    source_schema: imbalance
    source_data_class: IMBALANCE
    computation_method: "venue auction imbalance feed"
    window_length: null
    event_time_basis: true
    missing_data_behavior: skip
    degraded_status: false
    latency_estimate_ns: 80

promotion:
  require_ablation: true
  default_feature_set: none
