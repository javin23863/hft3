# configs/risk/options_limits.yaml
#
# OPTIONS LANE GREEK LIMITS + 0DTE TAPER — PLACEHOLDER VALUES
# ============================================================
# THRESHOLDS ARE PLACEHOLDERS pending WS-4 position-sizing studies and
# owner sign-off.  These values are operational starting-points, NOT
# calibrated risk limits.  Do not treat them as production constraints
# without independent sizing review.
#
# SCOPE: options lane only.  This file is NOT loaded by the live futures
# risk engine (options_risk module only).  Merge into the live config tree
# happens at Phase 2 gate with FCM-calibrated values.
#
# DEVIATION FROM PLAN TEXT: the plan specified adding 9 new triggers to
# configs/risk/kill_switch.yaml.  We have NOT done that.  Reason: the live
# futures lane parser has unknown-key strictness that cannot be verified
# offline; a bad merge would silently drop or break live risk checks.  The
# merge path is: (a) WS-4 completes sizing calibration, (b) FCM values are
# confirmed, (c) a dedicated Phase 2 gate PR edits kill_switch.yaml with
# full test coverage against the live parser.
#
# CONFIG STYLE: matches configs/risk/limits.yaml (flat key: value with one
# nesting level for bucketed sections).

# ---------------------------------------------------------------------------
# Greek limits by DTE bucket
# ---------------------------------------------------------------------------
# Bucket definitions:
#   dte_0    : 0DTE  (expiry today)
#   dte_1_3  : 1–3 DTE
#   weekly   : 4–7 DTE
#   monthly  : 8–45 DTE
#
# max_abs_delta       : max absolute net delta, expressed in futures-equivalent
#                       contracts.  PLACEHOLDER.
# max_abs_gamma       : max absolute net gamma per 1% move in underlying,
#                       expressed in futures-equivalent contracts.  PLACEHOLDER.
# max_short_vega_usd  : maximum negative (short) vega in USD.  Long vega is
#                       uncapped at this level (separate stress limit applies).
#                       PLACEHOLDER.
# max_abs_theta_usd   : max absolute theta in USD per calendar day.  PLACEHOLDER.

buckets:
  dte_0:
    max_abs_delta: 5.0
    max_abs_gamma: 2.0
    max_short_vega_usd: 500.0
    max_abs_theta_usd: 1000.0

  dte_1_3:
    max_abs_delta: 10.0
    max_abs_gamma: 4.0
    max_short_vega_usd: 1000.0
    max_abs_theta_usd: 2000.0

  weekly:
    max_abs_delta: 15.0
    max_abs_gamma: 6.0
    max_short_vega_usd: 2000.0
    max_abs_theta_usd: 3000.0

  monthly:
    max_abs_delta: 20.0
    max_abs_gamma: 8.0
    max_short_vega_usd: 4000.0
    max_abs_theta_usd: 5000.0

# ---------------------------------------------------------------------------
# Global portfolio limits
# ---------------------------------------------------------------------------
# margin_utilization_soft : warn (soft breach) when margin utilization exceeds
#                           this fraction.  PLACEHOLDER.
# margin_utilization_hard : hard breach + stop-new-orders when margin
#                           utilization exceeds this fraction.  PLACEHOLDER.
# hedge_presence_required : if true, naked short options (v0 definition:
#                           short option with zero futures and zero long options
#                           in same expiry) are flagged as invariant violations.

margin_utilization_soft: 0.50
margin_utilization_hard: 0.65
hedge_presence_required: true

# ---------------------------------------------------------------------------
# 0DTE taper
# ---------------------------------------------------------------------------
# Applies a linear taper to max_abs_gamma for naked short gamma in dte_0.
# start_ct  : taper begins at this Central Time (HH:MM); limit = configured.
# zero_by_ct: limit reaches zero at this Central Time (HH:MM).
# applies_to: currently only 'naked_short_gamma' is implemented.
# bucket    : which DTE bucket the taper applies to.
#
# After zero_by_ct any naked short gamma in the specified bucket is a hard
# breach regardless of size.

taper:
  start_ct: "12:00"
  zero_by_ct: "14:00"
  applies_to: naked_short_gamma
  bucket: dte_0
