    lane_id: cme_futures
    model_id: DEPTH_REFILL_IMBALANCE
    vectorbt_supported: true
    hftbacktest_supported: true
    promotion_eligible: true
    parameters:
      signal_threshold: [0.10, 0.15, 0.20]
      holding_period_bars: [5, 10, 20]
      stop_loss_pct: [0.005, 0.01, 0.02]
    objectives:
      primary: sharpe
      secondary:
        - net_pnl
        - num_trades
    vectorbt_top_n: 10
    hftbacktest_top_n: 5
    selection_policy: top_n_by_sharpe
