    promotion_eligible: true
    parameters:
      signal_threshold: [0.10, 0.15, 0.20]
      holding_period_bars: [5, 10, 15]
      stop_loss_pct: [0.005, 0.01]
    objectives:
      primary: sharpe
      secondary:
        - net_pnl
        - max_drawdown
    vectorbt_top_n: 10
    hftbacktest_top_n: 5
    selection_policy: top_n_by_sharpe
    feature_requirements:
