# Decadal parabolic low-float anomaly sessions (PARABOLIC_LOW_FLOAT_DECADAL.md)
repo_root: .
paths:
  raw_root: data/equities/raw
  normalized_root: data/equities/normalized
  daily_root: data/equities/daily
  manifest_root: data/equities/manifest
  float_metadata: data/equities/metadata/float_pit.csv

defaults:
  schema: mbo
  stype_in: raw_symbol
  premarket_start: "04:00"
  session_end: "16:00"
  l3_only: true
  daily_lookback_days: 756
  options:
    enabled: true
    dataset: OPRA.PILLAR
    schema: cbbo-1m
    stype_in: parent
    inherit_window: true
    chain_rules:
      reference_price: premarket_open
      strike_window_pct: 0.30
      max_strikes_per_side: 10
      expiry_policy: nearest_listed
      max_dte_days: 45

sessions:
