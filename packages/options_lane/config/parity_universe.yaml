repo_root: .
paths:
  raw_root: data/options/raw
  normalized_root: data/options/normalized
  replay_root: data/replay/parity
  reports_root: research_cards/parity

parity_groups:
  - id: example_same_ul
    type: futures_options
    tick_size: 0.25
    time_to_expiry_years: 0.25
    threshold_ticks: 1.0
    rate:
      source: constant
      value: 0.05
    legs:
      - {role: future, symbol: "ES.c.0", dataset: GLBX.MDP3}
      - {role: call, symbol: "ES.c.0", dataset: GLBX.MDP3, strike: 5500, right: C}
      - {role: put, symbol: "ES.c.0", dataset: GLBX.MDP3, strike: 5500, right: P}

  - id: example_cross_ul
    type: index_future_basis
    basis_model: index_minus_future
    basis_params:
      basis_scale: 1.0
    tick_size: 0.05
    time_to_expiry_years: 0.25
    threshold_ticks: 2.0
    rate:
      source: constant
      value: 0.05
    legs:
      - {role: spot, symbol: "SPX", dataset: OPRA.PILLAR}
      - {role: future, symbol: "ES.c.0", dataset: GLBX.MDP3}
      - {role: call, symbol: "SPX", dataset: OPRA.PILLAR, strike: 5500, right: C}
      - {role: put, symbol: "SPX", dataset: OPRA.PILLAR, strike: 5500, right: P}
