syntax = "proto3";

package edge_features;

// Main feature packet sent from edge daemon to Chicago
message EdgeFeaturePacket {
    // Timestamps and sequencing
    uint64 timestamp_ns = 1;           // SO_TIMESTAMPNS kernel timestamp
    uint64 sequence_number = 2;        // Monotonic packet counter
    
    // Welford's streaming statistics for fee rates
    double fee_mean_sat_vb = 3;        // Running mean fee (sat/vB)
    double fee_stddev_sat_vb = 4;      // Running standard deviation
    double fee_zscore_latest = 5;      // Z-score of latest transaction
    uint64 fee_sample_count = 6;       // Number of samples in statistics
    
    // t-digest streaming quantiles
    double fee_p20 = 7;                // 20th percentile fee
    double fee_p40 = 8;                // 40th percentile fee
    double fee_p60 = 9;                // 60th percentile fee
    double fee_p80 = 10;               // 80th percentile fee
    
    // Mempool state
    uint32 mempool_tx_count = 11;      // Total transactions in mempool
    uint64 mempool_bytes = 12;         // Total mempool size in bytes
    double blockspace_stress_score = 13; // 0.0-1.0 stress indicator
    
    // Delta updates (batched, max 100 per packet)
    repeated MempoolDelta deltas = 14;
    
    // Metadata
    double min_fee_threshold = 15;     // Current fee filter threshold
    uint32 filtered_tx_count = 16;     // Transactions dropped by filter
    uint32 delta_count = 17;           // Number of deltas in this packet
    
    // Health metrics
    uint64 uptime_seconds = 18;        // Daemon uptime
    uint64 packets_sent = 19;          // Total packets sent
    uint64 bytes_sent = 20;            // Total bytes sent
}

// Mempool state change
message MempoolDelta {
    enum DeltaType {
        ADD = 0;
        REMOVE = 1;
        REPLACE = 2;
    }
    
    DeltaType type = 1;
    bytes txid = 2;                    // 32-byte transaction ID
    double fee_rate = 3;               // Fee rate in sat/vB (ADD/REPLACE only)
    uint32 size_bytes = 4;             // Transaction size (ADD only)
    uint64 timestamp_ns = 5;           // Transaction timestamp (ADD only)
    RemovalReason removal_reason = 6;  // Why removed (REMOVE only)
    bytes old_txid = 7;                // Previous txid (REPLACE only)
}

// Why a transaction was removed from mempool
enum RemovalReason {
    BLOCK_INCLUSION = 0;               // Included in a block
    RBF = 1;                           // Replaced by fee
    EXPIRY = 2;                        // Expired from mempool
    CONFLICT = 3;                      // Conflicted with another tx
}

// Block notification (separate from mempool)
message BlockNotification {
    uint64 timestamp_ns = 1;           // Block arrival timestamp
    bytes block_hash = 2;              // 32-byte block hash
    uint32 block_height = 3;           // Block height
    uint32 tx_count = 4;               // Transactions in block
    uint64 block_size_bytes = 5;       // Block size
    double avg_fee_rate = 6;           // Average fee rate in block
    double median_fee_rate = 7;        // Median fee rate in block
}
