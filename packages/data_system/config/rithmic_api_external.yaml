# Rithmic R|API Plus - external Chicago broker profile.
# Credentials are supplied at runtime with RITHMIC_USERNAME / RITHMIC_PASSWORD.
# DO NOT copy secrets into this file.
#
# Chicago endpoint parameters observed from local Rithmic Trader Pro logs
# under C:\Users\MSI\Documents\Rithmic on 2026-06-04. Credentials remain
# runtime-only via RITHMIC_USERNAME / RITHMIC_PASSWORD.

api_version: "13.7.0.0"
endpoint_profile: "external_chicago"
system: "Rithmic Paper Trading"
gateway: "Chicago Area"
endpoint_params_status: "CONFIGURED_FROM_RTRADER_LOG"

engine_params:
  app_name: "HFT3"
  app_version: "1.0"

required_environment_params:
  - MML_DMN_SRVR_ADDR
  - MML_DOMAIN_NAME
  - MML_LIC_SRVR_ADDR
  - MML_LOC_BROK_ADDR
  - MML_LOGGER_ADDR

required_repository_params:
  - sCnnctPt

required_login_params:
  - sMdCnnctPt
  - sTsCnnctPt
  - sIhCnnctPt
  - sPnlCnnctPt

environment:
  MML_DMN_SRVR_ADDR: "ritpz01004.01.rithmic.com:65000~ritpz04063.04.rithmic.com:65000~ritpz01004.01.rithmic.net:65000~ritpz04063.04.rithmic.net:65000~ritpz01004.01.theomne.net:65000~ritpz04063.04.theomne.net:65000~ritpz01004.01.theomne.com:65000~ritpz04063.04.theomne.com:65000"
