# Rithmic R|API Plus v13.7.0.0 — Paper Trading configuration
# System: Rithmic Paper Trading
# Gateway: Chicago
# DO NOT commit credentials — use .env for RITHMIC_USERNAME / RITHMIC_PASSWORD
#
# Server addresses are for the Rithmic Paper Trading (ritpz) environment.
# Obtain exact connection params from the R|API Plus documentation bundle
# after passing conformance. The ports are standard R|API ports:
#   65000 = domain/server name service
#   56000 = license server
#   64100 = local broker
#   45454 = logger

api_version: "13.7.0.0"
system: "Rithmic Paper Trading"
gateway: "Chicago"

engine_params:
  app_name: "HFT3"
  app_version: "1.0"

environment:
  # Paper trading servers — replace with actual addrs from R|API docs
  MML_DMN_SRVR_ADDR: "ritpz04063.04.rithmic.com:65000"
  MML_DOMAIN_NAME: "rithmic_paper_domain"
  MML_LIC_SRVR_ADDR: "ritpz04063.04.rithmic.com:56000"
  MML_LOC_BROK_ADDR: "ritpz04063.04.rithmic.com:64100"
  MML_LOGGER_ADDR: "ritpz04063.04.rithmic.com:45454"
  MML_LOG_TYPE: "log_net"

repository_login:
  sCnnctPt: "login_agent_repositoryc"

login_params:
  sMdCnnctPt: "login_agent_tpc"
  sTsCnnctPt: "login_agent_opc"
  sIhCnnctPt: "login_agent_historyc"
  sPnlCnnctPt: "login_agent_pnlc"

ssl:
  cert_file: "rithmic_ssl_cert_auth_params"

sdk_paths:
  linux_x86_64: "rithmic_gateway/RApiPlus/13.7.0.0/linux-gnu-4.18-x86_64/lib"
  win10: "rithmic_gateway/RApiPlus/13.7.0.0/win10/lib"
  include: "rithmic_gateway/RApiPlus/13.7.0.0/include/RApiPlus.h"
