# Rithmic R|API Plus - LIVE production profile ("Rithmic 01", EdgeClear FCM).
# Credentials are supplied at runtime with RITHMIC_USERNAME / RITHMIC_PASSWORD.
# DO NOT copy secrets into this file.
#
# Parameters observed from local Rithmic Trader Pro live-session logs under
# C:\Users\MSI\Documents\Rithmic on 2026-07-03 (MML_DOMAIN_NAME =
# rithmic_prod_01_dmz_domain; Price/Order/History/RMS agents from the
# "Rithmic 01" login block). Entitlement verified working by user 2026-07-03
# (the 2026-06 rp_code 13 block is resolved).
#
# SCOPE: market-data capture only. Python order-send is hard-blocked in the
# bridge (PYTHON_RITHMIC_ORDER_SEND_DISABLED_USE_NATIVE_CPP_PROBE); live order
# routing remains behind cockpit controls per operations charter.

