authority:
- BLUEPRINT.md §8
- docs/vault/ECONOMIC_EVENT_UNIVERSE.md
defaults:
  # HFT release download window — all event types (MBO-only lane).
  download_window: &hft_release_window
    start_offset_seconds: -60
    end_offset_seconds: 10
  # Post-replay feature snapshots only — must fall within download window [-60s, +10s].
  snapshot_derivation_offsets:
  - {offset_us: -10000000, label: "-10s"}
  - {offset_us: -5000000, label: "-5s"}
  - {offset_us: -1000000, label: "-1s"}
  - {offset_us: -100000, label: "-100ms"}
  - {offset_us: -10000, label: "-10ms"}
  - {offset_us: -1000, label: "-1ms"}
  - {offset_us: -100, label: "-100us"}
  - {kind: release_boundary_pre, label: "0_pre"}
  - {kind: release_boundary_post, label: "0_post"}
  - {offset_us: 10, label: "+10us"}
  - {offset_us: 50, label: "+50us"}
  - {offset_us: 100, label: "+100us"}
  - {offset_us: 250, label: "+250us"}
  - {offset_us: 500, label: "+500us"}
  - {offset_us: 1000, label: "+1ms"}
  - {offset_us: 2000, label: "+2ms"}
  - {offset_us: 5000, label: "+5ms"}
  - {offset_us: 10000, label: "+10ms"}
  - {offset_us: 25000, label: "+25ms"}
  - {offset_us: 50000, label: "+50ms"}
  - {offset_us: 100000, label: "+100ms"}
  - {offset_us: 250000, label: "+250ms"}
  - {offset_us: 500000, label: "+500ms"}
  - {offset_us: 1000000, label: "+1s"}
  - {offset_us: 2000000, label: "+2s"}
  - {offset_us: 5000000, label: "+5s"}
  - {offset_us: 10000000, label: "+10s"}
  # Legacy second-granularity offsets for existing L3 tensor code (subset within window).
  snapshot_offsets_sec:
  - -10
  - -5
  - -1
  - 0
  - 1
  - 2
  - 5
  - 10
  symbol_universe_default: MES.v.0,MNQ.v.0,ES.v.0,NQ.v.0,ZN.v.0,ZB.v.0,RTY.v.0
