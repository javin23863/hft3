    - JZXN
    - TDIC
    - SOBR
    - AKAN
    - ERNA
    - RMSG
    - ELAB
    - PN
    - HCAI
    - AEHL
    - ONMD
    - LOBO
    - ABTS

notes:
  - "Cohort tickers are positive-event labels only, never model inputs."
  - "Resolve actual event dates from free daily OHLCV before any L2/L3 spend."
  - "L2/L3 pulls must be limited to snapshot windows, not full ticker histories."
  - "Tickers in delisted_seed_tickers are documented as data_source_exhausted; see that section."

delisted_seed_tickers:
  status: data_source_exhausted_free_daily
  description: "No free daily OHLCV source retains historical prices for these delisted small-cap names."
  sources_attempted:
    - "yahoo_v8_chart_period1_period2 (404 not_found)"
    - "stooq_csv (apikey_required)"
    - "sec_edgar_company_filings (no_daily_ohlcv_endpoint)"
  known_delisted:
    - APRN
    - RDBX
    - AERC
    - ANPC
    - WETG
    - MULN
    - SGN
    - SGBX
  remediation: "Requires a paid historical source such as Databento ohlcv-1d on a delisted-retaining dataset, or Polygon historical aggregates. Out of scope for the free-data phase."
  paid_remediation:
    description: "Optional paid-source pull path for delisted small-cap names. Requires API key. Will NOT run without it."
    source: databento
    dataset: XNAS.ITCH
    schema: ohlcv-1d
    stype_in: raw_symbol
    cost_per_symbol_per_year_usd_estimate: 0.05
    date_range_per_ticker:
      mode: cohort_year_window
      start_offset_days: -30
      end_offset_days: 0
    output_root: data/equities/daily_delisted
    script: scripts/fetch_delisted_daily.py
    refusal_policy:
      live_mode_requires_confirm: "--confirm-purchase"
      live_mode_requires_env: "DATABENTO_API_KEY"
      dry_run_default: true
      cost_controls:
        - "--max-total-cost-usd"
        - "--max-tickers"
        - "--override-operating-cap"
        - "--override-hard-limit"
