    - SOUN
    - NNE
    - APLD
    - POET
    - LASE
    - RR
    - ONCO
    - CNEY
    - KAVL
    - QUBT
    - DRUG
    - WHLR
  "2025":
    - MLGO
    - AREB
    - SGN
    - ASST
    - SGBX
    - SMX
    - SAFX
  2026_trailing_365:
    - DXST
    - BJDX
    - HKIT
    - MASK
    - OLOX
    - QTEX
    - ATPC
    - PCLA
    - PETZ
    - INM
