repo_root: .
description: Historical low-float runner benchmark seed set. Positive labels only.
paths:
  daily_root: data/equities/daily
  output_root: research_cards/equities/historical_runner_benchmark

free_data_phase:
  mode: local_daily_ohlcv_only
  no_paid_market_data_downloads: true
  event_detection:
    max_pre_event_close: 5.0
    min_intraday_return_pct: 30.0
    min_close_return_pct: 20.0
    min_volume_expansion: 3.0
    volume_lookback_days: 20
    event_cooldown_trading_days: 5
  snapshots:
    - T-10 trading days
    - T-5 trading days
    - T-3 trading days
    - T-2 trading days
    - T-1 close
    - T-1 after-hours
    - T0 premarket
    - T0 open
  free_daily_benchmark:
    description: "Pass/fail gate that lifts download_now=false on the L2/L3 plan."
    lift_l2_l3_download_when_passed: true
    rules:
      min_resolved_events: 5
      min_resolved_ticker_ratio: 0.10
      min_active_cohorts: 2
      min_median_event_strength: 1.0
      max_share_of_events_in_a_single_ticker: 0.75

l2_l3_phase:
  status: plan_only_until_free_daily_benchmark_passes
  minimal_windows:
    - T-1 after-hours
    - T0 premarket
    - T0 opening auction
    - T0 first 5 minutes

positive_seed_tickers:
  "2022":
    - TBLT
    - APRN
    - BBBY
    - RDBX
    - AERC
    - ANPC
  "2023":
