repo_root: .
l3_only: true
paths:
  raw_root: data/equities/raw
  normalized_root: data/equities/normalized
  daily_root: data/equities/daily
  replay_root: data/replay/equities
  reports_root: research_cards/equities
  float_metadata: data/equities/metadata/float_pit.csv
  daily_bars: data/equities/daily
  daily_bars_fixture: packages/equities_lane/fixtures/daily_bars.csv

databento:
  dataset: XNAS.ITCH
  schema_primary: mbo
  schema_degraded: mbp-1
  stype_in: raw_symbol
  session_start: "09:30"
  session_end: "16:00"
  premarket_start: "04:00"

sessions:
  - id: fixture_low_float_v1
    symbol: RUNNER
    date: "2024-03-15"
    fixture: low_float_session_v1.ndjson

filters:
  float_max_shares:
    enabled: true
    value: 20000000
  min_premarket_gap_pct:
    enabled: true
    value: 20.0
  min_rvol:
    enabled: true
    value: 3.0
    lookback_days: 20
  min_premarket_volume:
    enabled: true
    value: 400000
  min_float_rotation:
    enabled: true
    value: 0.5
  prior_runner:
    enabled: true
    min_prior_run_pct: 15.0
  overhead_resistance:
    enabled: false
    consolidation_days: 20

features:
  ofi: true
  vpin: true
  hawkes: true
  hmm: true
  l3_queue: true
  l3_cancellation: true
  l3_iceberg: true

patterns:
  orb_window_minutes: 10
  consolidation_pullback_pct: 3.0

signals:
  min_mlofi_pc1: 0.0
  min_hmm_markup_prob: 0.5
  max_vpin_exit_percentile: 0.95
  min_hawkes_score: 0.0

execution:
  latency_ms: 5.0
  slippage_bps: 10.0
  fee_per_share: 0.005
  allow_short: false
  borrow_fee_bps: 50.0
  halt_on_limit_up: true

walk_forward:
  train_days: 60
  val_days: 20
  test_days: 20
  step_days: 20

experiment:
  ablation_modules:
    - ofi
    - vpin
    - hawkes
    - hmm
