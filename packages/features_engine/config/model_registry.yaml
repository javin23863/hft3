# Unified model registry.
# Canonical id = descriptive slug; legacy_id is provenance-only metadata.

models:
  SECOND_WAVE_CONTINUATION:
    kind: hypothesis
    hyp_id: 1
    legacy_id: HYP_1
    display_name: Second-wave continuation
    class: SecondWaveContinuation
    aliases: ["second wave", "continuation", "post event continuation"]
    default_param_ranges:
      signal_threshold: [0.08, 0.35]
      stop_loss: [0.10, 0.50]
      take_profit: [0.10, 0.80]
