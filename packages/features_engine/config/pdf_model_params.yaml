# Shared parameters for PDF_MODEL_1..11 (see docs/structural_models/PDF_MODELS.md)

ofi:
  pca_levels: 5
  spoof_threshold: 0.5
  smooth_window: 10
  zscore_window: 50

vpin:
  buckets_per_day: 200
  lookback_bars: 30
  alert_percentile: 0.99
  student_t_df: 5

avellaneda_stoikov:
  gamma: 0.1
  kappa: 1.5
  default_sigma: 0.02
  time_horizon_sec: 3600.0
  vpin_lambda_scale: 0.001

lead_lag:
  ridge_alpha: 1.0
  min_samples: 20

dealer_gex:
  risk_free_rate: 0.05

transfer_entropy:
  lag: 1
  bins: 16
  ucl_multiplier: 2.0

quantum_spread:
  xi1: 1.0
  kappa1: 1.0
  small_delta: 0.25
  wide_delta: 2.0
  collapse_threshold: 0.65

stochastic_thermo:
  beta: 1.0
  exhaustion_threshold: 0.0

hawkes:
  mu: 0.1
  alpha: 0.5
  beta: 1.0
  gamma_base: 0.1
  gamma_scale: 2.0
  toxic_threshold: 1.0
