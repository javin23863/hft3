# HFC3 event types registry — target calendar (not all rows exist in events.csv yet)
# Do not fabricate consensus/surprise; mark optional fields missing until sourced.

authority:
  - chicago_cme_microstructure_a_plus_developer_handoff.pdf §9
  - BLUEPRINT.md §8

status_legend:
  PRESENT: rows exist in data_system/config/events.csv
  PARTIAL: label mapping exists in event_context.py only
  MISSING: no calendar rows yet

event_types:
  CPI:
    status: PRESENT
    anchor: "08:30 ET"
    asset_classes: [equity_index, rates]
  CORE_CPI:
    status: MISSING
    anchor: "08:30 ET"
  PPI:
    status: MISSING
  CORE_PPI:
    status: MISSING
  PCE:
    status: MISSING
  CORE_PCE:
    status: MISSING
  NFP:
    status: PRESENT
    anchor: "08:30 ET"
  UNEMPLOYMENT_CLAIMS:
    status: MISSING
  FOMC_STATEMENT:
    status: PARTIAL
    anchor: "14:00 ET"
    notes: event_context.py maps FOMC TIGHT; no events.csv rows
  FOMC_PRESS:
    status: PARTIAL
    anchor: "14:30 ET"
  FOMC_MINUTES:
    status: MISSING
  FED_SPEAKER:
    status: MISSING
  TREASURY_AUCTION:
    status: MISSING
  TREASURY_REFUNDING:
    status: MISSING
  EIA_CRUDE:
    status: MISSING
  EIA_NATGAS:
    status: MISSING
  USDA_WASDE:
    status: MISSING
  USDA_CROP:
    status: MISSING
  CASH_EQUITY_OPEN:
    status: PARTIAL
    anchor: "09:30 ET"
  FUTURES_ROLL:
    status: MISSING
  FUTURES_EXPIRY:
    status: MISSING
  OPTIONS_EXPIRY:
    status: MISSING
  PROP_FLATTEN_TOPSTEP:
    status: PRESENT
  PROP_REOPEN:
    status: PARTIAL
  FRIDAY_CLOSE:
    status: PARTIAL

optional_surprise_fields:
  - actual_value
  - consensus_value
  - prior_value
  - revised_prior_value
  - surprise_value
  - surprise_zscore
  policy: "Leave null unless sourced; never fake."

required_row_fields:
  - event_id
  - event_type
  - release_date
  - release_time
  - timezone
  - anchor_timestamp_utc
  - start_offset_seconds
  - end_offset_seconds
  - affected_symbols
  - affected_asset_classes
  - priority
  - source
  - source_url
  - point_in_time_safe
  - replay_safe
