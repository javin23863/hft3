[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hft3"
version = "0.1.0"
description = "Chicago CME microstructure research and execution stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20.0",
    "networkx>=3.2",
    "pandas>=2.0.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.6",
    "pyarrow>=15.0.0",
    "qrcode[pil]>=7.4.2",
]

[project.optional-dependencies]
# GBM research/paper lane for the decision engine (train.py --model lightgbm).
ml = ["lightgbm>=4.0"]

[project.scripts]
workbench = "workbench.__main__:main"
economic-event-universe = "economic_event_universe.cli:main"
llm-slow-tier = "llm_slow_tier.cli:main"

[tool.setuptools.packages.find]
where = [".", "apps", "packages"]
exclude = ["connectors*", "runtime*", "research_cards*", "artifacts*"]
namespaces = false

[tool.setuptools]
py-modules = ["hft3_bootstrap"]

[tool.setuptools.package-data]
"models.ghost_route" = ["*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages", "apps"]
markers = [
    "integration: requires built C++ binaries (hft_research_sim, hft_feature_golden)",
    "slow: long-running tests (external LLM endpoint, live services, etc.)",
]
