# Lane-first binding: every lane declares its universe, data, and model bindings.
# The workbench reads this to discover lanes, not hard-coded UI assumptions.
lanes:
  cme_futures:
    lane_id: cme_futures
    lane_name: CME Futures / Microstructure
    description: MBO replay walk-forward campaigns across 55 models on 7 CME futures symbols
    status: operational
    allowed_symbols: [MES.v.0, ES.v.0, MNQ.v.0, NQ.v.0, ZN.v.0, ZB.v.0, RTY.v.0]
    event_catalog: packages/data_system/config/events.csv
    data_roots:
      npz: data/npz
      latency_baselines: data/latency_baselines
    artifact_root: artifacts/research_cards/workbench_runs
    config_root: apps/workbench/config
    pipeline_class: campaign_runner
    runner_module: workbench.src.run.campaign_runner
    event_driven: true
    walk_forward_config: apps/workbench/config/walk_forward.yaml
    wfc_config: apps/workbench/config/wfc_gate.yaml
    cpp_latency_profile: apps/workbench/config/cpp_latency_profile.yaml
    validation_policies:
      - event_pit
      - walk_forward_gate
      - latency_authority
      - queue_realism
      - execution_cost_model

  equities_low_float:
    lane_id: equities_low_float
    lane_name: Equities Low-Float Runner
    description: Decadal parabolic anomaly stock sessions with MBO/L3 features, optional OPRA options
    status: operational
    session_config: packages/equities_lane/config/decadal_runners.yaml
    universe_config: packages/equities_lane/config/universe.yaml
    data_roots:
      raw: data/equities/raw
      normalized: data/equities/normalized
      daily: data/equities/daily
      npz: data/equities/npz
      float_metadata: data/equities/metadata
      options: data/options/equity_chains
    artifact_root: research_cards/equities
    config_root: packages/equities_lane/config
    pipeline_class: equities_runner
    runner_module: scripts.run_stocks_lane
    runner_args: [--max-events, "50000"]
    l3_policy: enforce
    l3_only: true
    options_feature_phase: optional
    options_feature_enabled_for: [KODK_2020, GME_2021, EXPR_2021]
    validation_policies:
      - equity_pit
      - l3_required
      - float_metadata_pit
      - option_quote_pit
      - parent_symbol_mapping

  options_parity:
    lane_id: options_parity
    lane_name: Options Put-Call Parity
    description: Multi-leg put-call parity arbitrage on futures options and index futures
    status: operational
    group_config: packages/options_lane/config/parity_universe.yaml
    data_roots:
      raw: data/options/raw
      normalized: data/options/normalized
    artifact_root: research_cards/parity
    config_root: packages/options_lane/config
    pipeline_class: parity_backtester
    runner_module: packages.options_lane.pipeline
    validation_policies:
      - quote_alignment
      - leg_definition_pit
      - multi_leg_fill_realism
      - rate_assumption_sensitivity

  crypto:
    lane_id: crypto
    lane_name: Crypto BTC Edge Detection
    description: BTC mempool, bookticker, and gold-data hypothesis testing with 7 ML models
    status: operational
    universe_config: packages/crypto_lane/config/universe.yaml
    data_roots:
      gold: data/crypto/gold
      mempool: data/crypto/mempool
      bookticker: data/crypto/bookticker
    artifact_root: research_cards/crypto
    config_root: packages/crypto_lane/config
    pipeline_class: crypto_smoke
    runner_module: packages.crypto_lane.pipeline
    validation_policies:
      - venue_data_availability
      - node_sync_status
      - mempool_preflight
      - bookticker_l3_gap_fill

