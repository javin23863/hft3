# Minimal autoresearch loop config (research-only).
max_generations: 3
max_candidates_per_generation: 5
robustness_max_candidates: 3
exploration_fraction: 0.2
hft_workers: 1
stop_no_improvement_generations: 2
target_score: null
symbol: MES
screening_scope: pilot
run_robustness: true
run_hft_campaign: false
hft_stages: [0]
vectorbt_min_trades: 3

# Edge-evaluation defaults for direct `scripts/run_pipeline.py` runs live in
# config/research_pipeline/default_runtime.json. Keep the loop aligned with
# those gates when forwarding explicit pipeline runtime overrides.
edge_evaluation:
  statistics:
    min_psr: null
    min_dsr: null
    alpha: 0.05
    power: 0.8
    sr_benchmark: 0.0
    require_sample_size: false
  validation:
    cscv: false
    cscv_subsets: 8
    max_pbo: null
  cost_model:
    spread_cost: 0.0
    commission_per_trade: 0.0
    slippage_bps: 0.0
    market_impact_coeff: 0.0

# Phase 7: bounded feature-family recipe search on Gen N+1 elites
family_search_enabled: true
family_search_fraction: 0.4

# Required when run_hft_campaign: true
hft_source_npz: null
hft_latency_model: null
hft_fill_queue_model: null
native_hot_path_evidence: []
