  JSON manifest symbols. Values are product metadata for replay economics; the
  lake symbols are Databento continuous symbols, so contract is an explicit
  continuous-front replay label, not a dated expiry claim. Future dated-contract
  source manifests must supply dated contract metadata explicitly. VIX.OPT is a
  sensor/clue source, not an executable HBT futures target.
