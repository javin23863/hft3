# Chicago futures hot-memory universe (hft3 market-state layer)
# Authority: docs/references/chicago_futures_hot_memory_a_plus_developer_prompt.pdf

core_protected_symbols: [ES, NQ, ZT, ZN, SR3]

defaults:
  instrument_type: futures
  asset_class: futures
  tradable: true
  order_book_available: true
  trade_print_available: true
  index_sensor_available: false
  point_in_time_safe: true
  data_delay_status: MISSING
  live_feed_status: MISSING
  historical_feed_status: MISSING
  currency: USD
  tick_size: 0.25
  tick_value: 12.50
  contract_multiplier: 50
  min_price_increment: 0.25
  roll_rule: volume
  failure_mode: degrade

